<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Album</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .album-title {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 20px;
            margin: 0 auto;
            text-align: center;
        }
        .gallery-image {
            border-radius: 10px;
            object-fit: cover;
        }
        .add-button {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <!-- Album Title -->
            <div class="col-auto d-flex align-items-center">
                <h3 class="album-title">Previous Wedding Album</h3>
            </div>
            <!-- Add Button -->
            <div class="col-auto ms-auto">
                <button class="btn btn-success add-button">+ Add</button>
            </div>
        </div>

        <!-- Gallery Grid -->
        <div class="row mt-3">
            <!-- Image 1 -->
            <div class="col-sm-6 col-md-4 mb-3">
                <img src="image1.jpg" class="img-fluid gallery-image" alt="Wedding Photo">
            </div>
            <!-- Image 2 -->
            <div class="col-sm-6 col-md-4 mb-3">
                <img src="image2.jpg" class="img-fluid gallery-image" alt="Wedding Photo">
            </div>
            <!-- Image 3 -->
            <div class="col-sm-6 col-md-4 mb-3">
                <img src="image3.jpg" class="img-fluid gallery-image" alt="Wedding Photo">
            </div>
            <!-- Image 4 -->
            <div class="col-sm-6 col-md-4 mb-3">
                <img src="image4.jpg" class="img-fluid gallery-image" alt="Wedding Photo">
            </div>
            <!-- Image 5 -->
            <div class="col-sm-6 col-md-4 mb-3">
                <img src="image5.jpg" class="img-fluid gallery-image" alt="Wedding Photo">
            </div>
            <!-- Image 6 -->
            <div class="col-sm-6 col-md-4 mb-3">
                <img src="image6.jpg" class="img-fluid gallery-image" alt="Wedding Photo">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
