<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New User</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <style>
        /* Image Preview Styling */
        .img-preview {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <!-- Add New decoration Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addUserModalLabel">Add New User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addUserForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="name" class="form-label">Decoration Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Price</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="profileImage" class="form-label">Decoration Image</label>
                            <input type="file" class="form-control" id="profileImage" accept="image/*">
                            <img id="imagePreviewAdd" class="img-preview" src="#" alt="Image Preview" style="display: none;">
                        </div>
                        <button type="submit" class="btn btn-primary">Add Decoration</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Trigger Modal Button -->
    <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addUserModal">
        Add New User
    </button>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript for Image Preview -->
    <script>
        document.getElementById("profileImage").addEventListener("change", function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById("imagePreviewAdd").src = e.target.result;
                    document.getElementById("imagePreviewAdd").style.display = "block";
                };
                reader.readAsDataURL(file);
            }
        });

        // Optional: JavaScript for handling form submission
        document.getElementById("addUserForm").addEventListener("submit", function(event) {
            event.preventDefault();
            const formData = new FormData(this);
            // Handle the form data here, such as sending it to the server
            alert("New user added!");
        });
    </script>
</body>
</html>
