<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    body {
    background-color: #f8f9fa;
    font-family: Arial, sans-serif;
        }

        /* Header */
        .navbar {
            background-color: #435739;
            padding: 1rem;
        }

        .navbar-brand {
            font-family: 'Georgia', serif;
            font-size: 2rem;
            font-weight: bold;
        }
        .fa-arrow-left{
            margin-left: 2%;
            margin-top: 1%;
        }

.card {
    border: none;
    border-radius: 15px;
    margin-bottom: 20px;
}

/* .card-img-top {
    width: 100px;
    height: 100px;
    object-fit: cover;
    margin-top: 20px;
} */

.card-body {
    background-color: #ffffff;
}

.card-title {
    font-size: 24px;
    font-weight: bold;
}

.card-text {
    font-size: 16px;
    color: gray;
}
/* .btn{
    color: #435739;
} */
.table th {
    width: 30%;   
    font-weight: normal;
}
.btn{
    color: #435739;
}

  </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <a class="navbar-brand" href="#">EVENTO</a>
    </nav>
    <a href="home1.html"><i class="fa fa-arrow-left" aria-hidden="true"></i></a>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <!-- <img src="https://via.placeholder.com/150" class="card-img-top rounded-circle" alt="User Photo"> -->
                    <div class="card-body text-center">
                        <h5 class="card-title ">John Doe</h5>
                        <!-- <p class="card-text">Web Developer</p> -->
                        <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#editProfileModal">Edit Profile</button>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">Personal Information</h4>
                        <table class="table">
                            <tbody>
                                <tr>
                                    <th>Full Name</th>
                                    <td>John Doe</td>
                                </tr>
                                <tr>
                                    <th>Email</th>
                                    <td>johndoe@example.com</td>
                                </tr>
                                <tr>
                                    <th>Phone</th>
                                    <td>+123 456 789</td>
                                </tr>
                                <tr>
                                    <th>Address</th>
                                    <td>1234 Elm Street, Cityville</td>
                                </tr>
                                <tr>
                                    <th>Place</th>
                                    <td> Cityville</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editProfileModalLabel">Edit Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" value="John Doe">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" value="johndoe@example.com">
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="text" class="form-control" id="phone" value="+123 456 789">
                        </div>
                        <div class="mb-3">
                            <label for="address" class="form-label">Address</label>
                            <input type="text" class="form-control" id="address" value="1234 Elm Street, Cityville">
                        </div>
                        <div class="mb-3">
                            <label for="place" class="form-label">Place</label>
                            <input type="text" class="form-control" id="place" value="Cityville">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
