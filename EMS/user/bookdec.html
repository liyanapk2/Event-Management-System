<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Booking</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        body {
    background-color: #f5f5f0;
    font-family: Arial, sans-serif;
}


         /* Header */
         .navbar {
            background-color: #435739;
            padding: 1rem;
        }

        .navbar-brand {
            font-family: 'Georgia', serif;
            font-size: 2rem;
            font-weight: bold;
        }

.card {
    background-color: #d2d8b3;
}

.card-body p {
    font-size: 18px;
    color: #333;
}


.form-control {
    background-color: #d2d8b3;
    border: none;
    color: #333;
}

.btn-success {
    background-color: #606c38;
    border: none; 
    
            color: rgb(255, 255, 255);
            margin-top: -1rem;
            margin-left: 12rem;
}

.btn-success:hover {
    background-color: #495726;
}

.btn-success a{
    color: white;
}

    </style>
</head>
<body>

   
    <nav class="navbar navbar-expand-lg navbar-light">
        <a class="navbar-brand" href="#">EVENTO</a>
        <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contact Us</a></li>
            <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-user"></i></a></li>         

        </ul>
    </nav> 

    <!-- Main content -->
    <div class="container mt-5">
        <div class="row">
            <!-- Image and Booking Button -->
            <div class="col-md-4">
                <div class="card">
                    <img src="/EVENT IMG/dec1.jpg" class="card-img-top" alt="Event Image">
                    <div class="card-body">
                        <h5 class="card-title">Image1</h5>
                        <p class="card-text">Rs: 25000</p>
                    </div>
                </div>
            </div>

            <!-- Booking Form -->
            <div class="col-md-8">
                <form>
                    <div class="form-group">
                        <label>Full Name:</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Mobile:</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Event date:</label>
                        <div class="row">
                            <div class="col">
                                <label>From:</label>
                                <input type="date" class="form-control" placeholder="From">
                            </div>
                            <div class="col">
                                <label>To:</label>
                                <input type="date" class="form-control" placeholder="To">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>No. of guests:</label>
                        <input type="number" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Event Type:</label>
                        <div>
                            <label><input type="radio" name="eventType" value="pre-wedding"> Pre wedding</label>
                            <label><input type="radio" name="eventType" value="wedding"> Wedding</label>
                            <label><input type="radio" name="eventType" value="reception"> Reception</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Event Time:</label>
                        <div>
                            <label><input type="radio" name="eventTime" value="day"> Day</label>
                            <label><input type="radio" name="eventTime" value="evening"> Evening</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success"><a href="services.html">Back</a></button>

                    <button type="submit" class="btn btn-success"><a href="foodbook.html">Next</a></button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
